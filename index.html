<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dasbor Builder Web — zikzapp/my-web</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: rgba(20, 22, 30, 0.85);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent-1: #ff5e1a;
      --accent-2: #e11d48;
      --ok: #22c55e;
      --err: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 94, 26, 0.18), transparent 45%),
        radial-gradient(circle at bottom right, rgba(225, 29, 72, 0.16), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .header-sub {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .btn-link-inline {
      background: none;
      border: none;
      color: #fb923c;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .upload-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 14px;
    }

    .btn-upload {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .file-name {
      font-size: 0.85rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    textarea,
    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: rgba(5, 6, 10, 0.75);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      color: var(--text);
      padding: 12px;
      font-size: 0.9rem;
      outline: none;
    }

    textarea {
      min-height: 210px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      resize: vertical;
      margin-bottom: 14px;
    }

    textarea:focus,
    input:focus {
      border-color: var(--accent-1);
    }

    .field-group {
      margin-bottom: 14px;
    }

    .token-row {
      display: flex;
      gap: 8px;
    }

    .btn-secondary-sm {
      background: #1f2433;
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-grad {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      color: #fff;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-grad:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-dark {
      width: 100%;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 0.86rem;
      letter-spacing: 0.4px;
      color: var(--text);
      background: rgba(15, 17, 24, 0.9);
      cursor: pointer;
      margin-bottom: 14px;
    }

    .status-text {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      min-height: 20px;
      word-break: break-word;
    }

    .status-ok {
      color: var(--ok);
    }

    .status-err {
      color: var(--err);
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .preview-title {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-left: 3px solid var(--accent-1);
      padding-left: 8px;
    }

    .preview-controls {
      display: flex;
      gap: 6px;
    }

    .chip-btn {
      background: #1b1f2b;
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .chip-btn.active {
      background: var(--accent-1);
      border-color: var(--accent-1);
      color: #fff;
    }

    .preview-stage {
      display: flex;
      justify-content: center;
      background: #050608;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px;
      min-height: 240px;
    }

    iframe#preview-frame {
      width: 100%;
      height: 360px;
      border: none;
      border-radius: 8px;
      background: #ffffff;
      transition: width 0.2s ease;
    }

    iframe#preview-frame.mode-hp {
      width: 360px;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header-title">BUILDER WEB KE INDEX.HTML</div>
      <div class="header-sub">Target: <strong>zikzapp/my-web</strong> → <code>index.html</code></div>
    </div>

    <div class="card">
      <input type="file" id="file-input" accept=".html,.htm,.txt" hidden />
      <div class="upload-box">
        <button type="button" class="btn-upload" id="btn-pilih-file">PILIH FILE</button>
        <span class="file-name" id="nama-file">Tidak ada file yang dipilih</span>
      </div>

      <div class="label-row">
        <span>KODE HTML / CSS / JS</span>
        <button type="button" class="btn-link-inline" id="btn-hapus">[ HAPUS ]</button>
      </div>
      <textarea id="kode-html" placeholder="Tempel atau tulis kode HTML di sini..."></textarea>

      <div class="field-group">
        <div class="label-row"><span>NAMA PROYEK</span></div>
        <input type="text" id="nama-proyek" placeholder="Contoh: zikzproyek" />
      </div>

      <div class="field-group">
        <div class="label-row"><span>GITHUB TOKEN (CONTENTS: READ &amp; WRITE)</span></div>
        <div class="token-row">
          <input type="password" id="gh-token" placeholder="Tempel token GitHub kamu..." />
          <button type="button" class="btn-secondary-sm" id="btn-simpan-token">Simpan</button>
        </div>
      </div>

      <button type="button" class="btn-grad" id="btn-preview">PREVIEW WEBSITE</button>
      <button type="button" class="btn-dark" id="btn-download">DOWNLOAD HTML</button>
      <button type="button" class="btn-grad" id="btn-buat-web">BUAT WEB NYA</button>

      <div class="status-text" id="status-log">Token belum tersimpan di browser ini.</div>
    </div>

    <div class="card" id="preview-card">
      <div class="preview-header">
        <div class="preview-title">LIVE PREVIEW</div>
        <div class="preview-controls">
          <button type="button" class="chip-btn active" id="mode-full">FULL</button>
          <button type="button" class="chip-btn" id="mode-hp">HP</button>
          <button type="button" class="chip-btn" id="mode-tutup">TUTUP</button>
        </div>
      </div>
      <div class="preview-stage" id="preview-stage">
        <iframe id="preview-frame" sandbox="allow-scripts allow-forms allow-modals"></iframe>
      </div>
    </div>
  </div>

  <script>
    const OWNER = 'zikzapp';
    const REPO = 'my-web';
    const FILE_PATH = 'index.html';
    const BRANCH = 'main';
    const TOKEN_STORAGE_KEY = 'zikzapp_gh_token_index';

    const fileInput = document.getElementById('file-input');
    const btnPilihFile = document.getElementById('btn-pilih-file');
    const namaFile = document.getElementById('nama-file');
    const kodeHtml = document.getElementById('kode-html');
    const namaProyek = document.getElementById('nama-proyek');
    const ghTokenInput = document.getElementById('gh-token');
    const btnSimpanToken = document.getElementById('btn-simpan-token');
    const btnHapus = document.getElementById('btn-hapus');
    const btnPreview = document.getElementById('btn-preview');
    const btnDownload = document.getElementById('btn-download');
    const btnBuatWeb = document.getElementById('btn-buat-web');
    const statusLog = document.getElementById('status-log');
    const previewFrame = document.getElementById('preview-frame');
    const previewStage = document.getElementById('preview-stage');
    const modeFull = document.getElementById('mode-full');
    const modeHp = document.getElementById('mode-hp');
    const modeTutup = document.getElementById('mode-tutup');

    function setStatus(msg, type = '') {
      statusLog.textContent = msg;
      statusLog.className = 'status-text' + (type ? ` status-${type}` : '');
    }

    function initToken() {
      const saved = localStorage.getItem(TOKEN_STORAGE_KEY);
      if (saved) {
        ghTokenInput.value = saved;
        setStatus('Token tersimpan di browser ini.', 'ok');
      } else {
        setStatus('Token belum tersimpan di browser ini.');
      }
    }

    btnSimpanToken.addEventListener('click', () => {
      const token = ghTokenInput.value.trim();
      if (!token) {
        setStatus('Masukkan token GitHub terlebih dahulu.', 'err');
        return;
      }
      localStorage.setItem(TOKEN_STORAGE_KEY, token);
      setStatus('Token tersimpan di browser ini.', 'ok');
    });

    btnPilihFile.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      namaFile.textContent = file.name;
      const reader = new FileReader();
      reader.onload = (ev) => {
        kodeHtml.value = ev.target.result;
        renderPreview();
      };
      reader.readAsText(file);
    });

    btnHapus.addEventListener('click', () => {
      kodeHtml.value = '';
      fileInput.value = '';
      namaFile.textContent = 'Tidak ada file yang dipilih';
      previewFrame.srcdoc = '';
      setStatus('Kode dikosongkan.');
    });

    function renderPreview() {
      previewStage.style.display = 'flex';
      modeTutup.classList.remove('active');
      previewFrame.srcdoc = kodeHtml.value;
    }

    btnPreview.addEventListener('click', renderPreview);

    modeFull.addEventListener('click', () => {
      previewStage.style.display = 'flex';
      previewFrame.classList.remove('mode-hp');
      modeFull.classList.add('active');
      modeHp.classList.remove('active');
      modeTutup.classList.remove('active');
    });

    modeHp.addEventListener('click', () => {
      previewStage.style.display = 'flex';
      previewFrame.classList.add('mode-hp');
      modeHp.classList.add('active');
      modeFull.classList.remove('active');
      modeTutup.classList.remove('active');
    });

    modeTutup.addEventListener('click', () => {
      previewStage.style.display = 'none';
      modeTutup.classList.add('active');
      modeFull.classList.remove('active');
      modeHp.classList.remove('active');
    });

    btnDownload.addEventListener('click', () => {
      const isi = kodeHtml.value;
      if (!isi.trim()) {
        setStatus('Tidak ada kode HTML untuk diunduh.', 'err');
        return;
      }
      const slug = (namaProyek.value.trim() || 'index')
        .toLowerCase()
        .replace(/[^a-z0-9-_]/g, '-');
      const blob = new Blob([isi], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${slug}.html`;
      a.click();
      URL.revokeObjectURL(url);
      setStatus(`File ${slug}.html berhasil diunduh.`, 'ok');
    });

    function toBase64Utf8(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) {
        bin += String.fromCharCode(bytes[i]);
      }
      return btoa(bin);
    }

    async function getExistingFileSha(token) {
      const endpoint = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}?ref=${encodeURIComponent(BRANCH)}`;
      const res = await fetch(endpoint, {
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json'
        }
      });
      if (res.status === 404) return null;
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || `Gagal membaca ${FILE_PATH} (${res.status})`);
      }
      const data = await res.json();
      return data.sha;
    }

    btnBuatWeb.addEventListener('click', async () => {
      const htmlContent = kodeHtml.value;
      const token = (localStorage.getItem(TOKEN_STORAGE_KEY) || ghTokenInput.value).trim();
      const projectLabel = namaProyek.value.trim() || 'dashboard';

      if (!htmlContent.trim()) {
        setStatus('Kode HTML masih kosong.', 'err');
        return;
      }

      if (!token) {
        setStatus('Token belum tersimpan di browser ini.', 'err');
        return;
      }

      btnBuatWeb.disabled = true;
      try {
        setStatus(`Mengecek ${FILE_PATH} di ${OWNER}/${REPO}...`);
        const sha = await getExistingFileSha(token);

        setStatus(`Menyimpan kode ke ${FILE_PATH}...`);
        const body = {
          message: `Update ${FILE_PATH} (${projectLabel}) via dashboard`,
          content: toBase64Utf8(htmlContent),
          branch: BRANCH
        };
        if (sha) body.sha = sha;

        const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        const putData = await putRes.json().catch(() => ({}));
        if (!putRes.ok) {
          throw new Error(putData.message || `Gagal menyimpan (${putRes.status})`);
        }

        setStatus(
          `Berhasil disimpan ke index.html! Aktif di https://${OWNER}.github.io/${REPO}/ (tunggu 1-2 menit).`,
          'ok'
        );
      } catch (err) {
        setStatus(`Gagal: ${err.message}`, 'err');
      } finally {
        btnBuatWeb.disabled = false;
      }
    });

    initToken();
  </script>
</body>
</html>
