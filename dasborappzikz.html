<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIKZ APP // DASBOR SERVER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #050507;
      --surface: rgba(10, 10, 14, 0.92);
      --elevated: #050507;
      --border: rgba(255, 255, 255, 0.14);
      --border-fire: rgba(255, 81, 0, 0.55);
      --text: #f9fafb;
      --muted: #cbd5e1;
      --fire-1: #ff5100;
      --fire-2: #ff1e42;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 81, 0, 0.22), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      padding: 1.5rem 1rem 3rem;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ff9e75;
      background: rgba(255, 81, 0, 0.12);
      border: 1px solid var(--border-fire);
      padding: 0.38rem 1rem;
      border-radius: 999px;
      margin-bottom: 0.65rem;
    }

    h1 {
      font-size: clamp(1.45rem, 5vw, 2.1rem);
      font-weight: 800;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 20%, #ff8c5a 60%, var(--fire-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .top-nav {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      margin-bottom: 1.25rem;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-bottom: 0.85rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-size: 0.92rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .accent-bar {
      width: 4px;
      height: 16px;
      border-radius: 99px;
      background: linear-gradient(180deg, var(--fire-1), var(--fire-2));
    }

    .field { margin-bottom: 1rem; }

    .field-label {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 0.95rem;
      font-size: 0.88rem;
      font-family: 'JetBrains Mono', monospace;
    }

    input:focus {
      outline: none;
      border-color: var(--fire-1);
      box-shadow: 0 0 0 3px rgba(255, 81, 0, 0.22);
    }

    .btn-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 0.78rem 1rem;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .btn-fire {
      background: linear-gradient(135deg, var(--fire-1), var(--fire-2));
      color: #fff;
      box-shadow: 0 10px 22px rgba(255, 42, 66, 0.3);
      flex: 1 1 160px;
    }

    .btn-dark {
      background: var(--elevated);
      color: var(--text);
      border: 1px solid var(--border);
      flex: 1 1 140px;
    }

    .status {
      margin-top: 0.8rem;
      font-size: 0.82rem;
      line-height: 1.5;
      color: #ff9e75;
      word-break: break-word;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 0.9rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">ZIKZ APP CONTROL PANEL</div>
      <h1>Dasbor Server</h1>
    </header>

    <div class="top-nav">
      <a class="btn btn-dark" href="index.html">Kembali ke Studio Web</a>
    </div>

    <!-- SERVER 1: GITHUB -->
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="accent-bar"></span>
          <span>SERVER 1 // GITHUB</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="dash-gh-token">Token GitHub (Fine-Grained / PAT)</label>
        <input type="password" id="dash-gh-token" placeholder="Tempel token GitHub...">
      </div>

      <div class="btn-row">
        <button class="btn btn-fire" type="button" onclick="saveGitHub()">Simpan Token GitHub</button>
        <button class="btn btn-dark" type="button" onclick="clearGitHub()">Hapus Token GitHub</button>
      </div>
      <div id="status-gh" class="status"></div>
    </section>

    <!-- SERVER 2: NETLIFY -->
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="accent-bar"></span>
          <span>SERVER 2 // NETLIFY</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="dash-nf-token">Netlify Personal Access Token</label>
        <input type="password" id="dash-nf-token" placeholder="Tempel token baru Netlify...">
      </div>

      <div class="field">
        <label class="field-label" for="dash-nf-site">Netlify Site ID (Opsional)</label>
        <input type="text" id="dash-nf-site" placeholder="Kosongkan untuk otomatis buat site baru">
      </div>

      <div class="btn-row">
        <button class="btn btn-fire" type="button" onclick="saveNetlify()">Simpan Netlify</button>
        <button class="btn btn-dark" type="button" onclick="clearNetlify()">Hapus Netlify</button>
      </div>
      <div id="status-nf" class="status"></div>
    </section>

    <!-- MAINTENANCE MODE (publish maintenance.json ke repo GitHub) -->
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="accent-bar"></span>
          <span>MODE MAINTENANCE WEB</span>
        </div>
      </div>

      <div class="check-row">
        <input type="checkbox" id="dash-maint-active">
        <label for="dash-maint-active" style="cursor:pointer;">Aktifkan Layar Maintenance di index.html</label>
      </div>

      <div class="field">
        <label class="field-label" for="dash-maint-msg">Pesan Maintenance</label>
        <input type="text" id="dash-maint-msg" value="Sedang dalam perbaikan dan pemeliharaan sistem ZIKZ APP.">
      </div>

      <div class="btn-row">
        <button class="btn btn-fire" type="button" onclick="publishMaintenance()">Update maintenance.json (GitHub)</button>
      </div>
      <div id="status-maint" class="status"></div>
    </section>
  </div>

  <script>
    function getGitHubTokenValue() {
      try {
        return (
          localStorage.getItem('zikzapp_admin_token_v1') ||
          localStorage.getItem('zikzapp_admin_token') ||
          localStorage.getItem('zikzapp_gh_token') ||
          ''
        ).trim();
      } catch (err) {
        return '';
      }
    }

    function getRepoTarget() {
      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(p => p.length > 0);
      let owner = 'stokemailzikzstr-coder';
      let repo = 'my-web';

      if (host.includes('github.io')) {
        owner = host.split('.')[0] || owner;
        repo = pathParts.length > 0 && !pathParts[0].endsWith('.html') ? pathParts[0] : `${owner}.github.io`;
      }
      return { fullSlug: `${owner}/${repo}` };
    }

    function toBase64Utf8(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    function loadAll() {
      try {
        const gh = getGitHubTokenValue();
        const nfTok = localStorage.getItem('zikzapp_nf_token') || '';
        const nfSite = localStorage.getItem('zikzapp_nf_site_id') || '';

        if (gh) document.getElementById('dash-gh-token').value = gh;
        if (nfTok) document.getElementById('dash-nf-token').value = nfTok;
        if (nfSite) document.getElementById('dash-nf-site').value = nfSite;

        document.getElementById('status-gh').textContent = gh ? 'Token GitHub tersimpan di browser.' : 'Belum ada token GitHub tersimpan.';
        document.getElementById('status-nf').textContent = nfTok ? 'Token Netlify tersimpan di browser.' : 'Belum ada token Netlify tersimpan.';
      } catch (err) {}
    }

    function saveGitHub() {
      const val = (document.getElementById('dash-gh-token').value || '').trim();
      if (!val) {
        document.getElementById('status-gh').textContent = 'Isi token GitHub terlebih dahulu.';
        return;
      }
      try {
        localStorage.setItem('zikzapp_admin_token_v1', val);
        localStorage.setItem('zikzapp_admin_token', val);
        localStorage.setItem('zikzapp_gh_token', val);
        document.getElementById('status-gh').textContent = 'Token GitHub berhasil disimpan di browser.';
      } catch (err) {
        document.getElementById('status-gh').textContent = 'Gagal menyimpan token GitHub.';
      }
    }

    function clearGitHub() {
      try {
        localStorage.removeItem('zikzapp_admin_token_v1');
        localStorage.removeItem('zikzapp_admin_token');
        localStorage.removeItem('zikzapp_gh_token');
        document.getElementById('dash-gh-token').value = '';
        document.getElementById('status-gh').textContent = 'Token GitHub dihapus dari browser.';
      } catch (err) {}
    }

    function saveNetlify() {
      const tok = (document.getElementById('dash-nf-token').value || '').trim();
      const site = (document.getElementById('dash-nf-site').value || '').trim();
      if (!tok) {
        document.getElementById('status-nf').textContent = 'Isi token Netlify terlebih dahulu.';
        return;
      }
      try {
        localStorage.setItem('zikzapp_nf_token', tok);
        localStorage.setItem('zikzapp_nf_site_id', site);
        document.getElementById('status-nf').textContent = 'Token & Site ID Netlify berhasil disimpan di browser.';
      } catch (err) {
        document.getElementById('status-nf').textContent = 'Gagal menyimpan data Netlify.';
      }
    }

    function clearNetlify() {
      try {
        localStorage.removeItem('zikzapp_nf_token');
        localStorage.removeItem('zikzapp_nf_site_id');
        document.getElementById('dash-nf-token').value = '';
        document.getElementById('dash-nf-site').value = '';
        document.getElementById('status-nf').textContent = 'Data Netlify dihapus dari browser.';
      } catch (err) {}
    }

    async function publishMaintenance() {
      const statusEl = document.getElementById('status-maint');
      const token = getGitHubTokenValue();
      if (!token) {
        statusEl.textContent = 'Simpan Token GitHub dulu untuk update maintenance.json.';
        return;
      }

      const active = document.getElementById('dash-maint-active').checked;
      const message = (document.getElementById('dash-maint-msg').value || '').trim() || 'Sedang dalam perbaikan dan pemeliharaan sistem ZIKZ APP.';
      const { fullSlug } = getRepoTarget();
      const apiUrl = `https://api.github.com/repos/${fullSlug}/contents/maintenance.json`;

      statusEl.textContent = 'Mengupdate maintenance.json...';

      try {
        let sha = null;
        const checkRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
          headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
          cache: 'no-store'
        });
        if (checkRes.ok) {
          const existing = await checkRes.json();
          sha = existing.sha;
        }

        const contentJson = JSON.stringify({ maintenance: active, message }, null, 2);
        const payload = {
          message: `Update maintenance.json (${active ? 'ON' : 'OFF'})`,
          content: toBase64Utf8(contentJson)
        };
        if (sha) payload.sha = sha;

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        const result = await putRes.json();
        if (!putRes.ok) throw new Error(result.message || `HTTP ${putRes.status}`);

        statusEl.textContent = `Berhasil! Maintenance sekarang ${active ? 'AKTIF' : 'NONAKTIF'}.`;
      } catch (err) {
        statusEl.textContent = `Gagal: ${err.message}`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadAll);
  </script>
</body>
</html>
