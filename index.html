<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIKZ APP // HTML TO WEB</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #050507;
      --surface: rgba(5, 5, 7, 0.88);
      --surface-elevated: #050507;
      --border: rgba(255, 255, 255, 0.14);
      --border-fire: rgba(255, 77, 0, 0.55);
      --text: #f9fafb;
      --muted: #cbd5e1;
      --fire-1: #ff5100;
      --fire-2: #ff1e42;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: transparent !important;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .bg-base { position: fixed; inset: 0; background: #050507; z-index: -5; }

    #bg-video {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: -2; opacity: 1; pointer-events: none;
    }

    .bg-scrim { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: transparent; }

    .hero-header {
      padding: 2.25rem 1rem 1rem; text-align: center; position: relative;
      z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 0.9rem;
    }

    .logo-box {
      width: 156px; height: 156px; border-radius: 28px; background: #050507;
      border: 1px solid rgba(255, 136, 0, 0.55); display: flex; align-items: center;
      justify-content: center; overflow: hidden; box-shadow: 0 0 28px rgba(255, 81, 0, 0.35);
      user-select: none; pointer-events: none; animation: logoSpin 14s linear infinite; will-change: transform;
    }

    @keyframes logoSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .logo-img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.75rem;
      font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #ff9e75;
      background: #050507; border: 1px solid rgba(255, 81, 0, 0.5); padding: 0.4rem 1.1rem; border-radius: 999px;
    }

    .hero-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff5100; box-shadow: 0 0 10px #ff5100; }

    .container {
      max-width: 1120px; margin: 0 auto; padding: 1.25rem 1.25rem 2.5rem;
      display: grid; grid-template-columns: 1fr; gap: 1.25rem;
    }

    @media (min-width: 900px) {
      .container { grid-template-columns: 1.05fr 0.95fr; align-items: start; }
    }

    .panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.25rem; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55); margin-bottom: 1.25rem;
    }

    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      padding-bottom: 0.9rem; margin-bottom: 1.1rem; border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }

    .panel-title {
      font-size: 0.95rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
      display: flex; align-items: center; gap: 0.55rem;
    }

    .accent-bar { width: 4px; height: 16px; border-radius: 99px; background: linear-gradient(180deg, var(--fire-1), var(--fire-2)); }

    .field { margin-bottom: 1rem; }

    .field-label {
      display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
      margin-bottom: 0.45rem; gap: 0.5rem; flex-wrap: wrap;
    }

    .file-box { background: var(--surface-elevated); border: 1px solid rgba(255, 81, 0, 0.45); border-radius: 12px; padding: 0.65rem 0.75rem; }

    input[type="file"] { width: 100%; font-size: 0.82rem; color: var(--muted); cursor: pointer; }

    input[type="file"]::file-selector-button {
      background: linear-gradient(135deg, var(--fire-1), var(--fire-2)); color: #fff; border: none;
      border-radius: 8px; padding: 0.45rem 0.85rem; margin-right: 0.7rem; font-size: 0.78rem;
      font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
    }

    input[type="text"], textarea {
      width: 100%; background: var(--surface-elevated); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.8rem 0.95rem; font-size: 0.9rem; transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea { min-height: 240px; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; line-height: 1.55; resize: vertical; }

    input[type="text"]:focus, textarea:focus {
      outline: none; border-color: var(--fire-1); box-shadow: 0 0 0 3px rgba(255, 81, 0, 0.25);
    }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; margin-top: 0.5rem; }

    .btn {
      appearance: none; border: none; border-radius: 12px; padding: 0.82rem 1rem; font-size: 0.8rem;
      font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      transition: transform 0.14s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.97); }

    .btn-fire { grid-column: 1 / -1; background: linear-gradient(135deg, var(--fire-1), var(--fire-2)); color: #fff; box-shadow: 0 10px 24px rgba(255, 42, 66, 0.35); }
    .btn-fire:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 12px 28px rgba(255, 65, 20, 0.5); }
    .btn-ember { background: #050507; color: #ff9c73; border: 1px solid var(--border-fire); }
    .btn-dark { grid-column: 1 / -1; background: #050507; color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 0.42rem 0.72rem; font-size: 0.72rem; border-radius: 8px; }

    .publish-box {
      margin-top: 1rem; padding: 1rem; border-radius: 12px; background: #050507; border: 1px solid rgba(255, 81, 0, 0.5);
    }

    .output-tag {
      font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: #ff9c73;
      margin-bottom: 0.6rem;
    }

    .output-actions { display: flex; gap: 0.6rem; margin-top: 0.65rem; flex-wrap: wrap; }
    .output-actions .btn { flex: 1 1 130px; padding: 0.65rem 0.85rem; }

    .publish-status { margin-top: 0.75rem; font-size: 0.8rem; line-height: 1.5; color: var(--muted); word-break: break-all; }
    .publish-status a { color: #ff9e75; font-weight: 700; }

    .preview-controls { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .preview-wrapper { width: 100%; display: flex; justify-content: center; }

    .preview-frame {
      width: 100%; height: 440px; border: 1px solid var(--border); border-radius: 12px;
      background: #050507; transition: max-width 0.2s ease;
    }

    .preview-frame.mobile-mode { max-width: 375px; }

    .preview-empty {
      height: 440px; border: 1px solid var(--border); border-radius: 12px; background: #050507;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 1.5rem; color: var(--muted); font-size: 0.86rem; gap: 0.4rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="bg-base"></div>
  <video id="bg-video" autoplay muted loop playsinline preload="auto" src="ssstik.io_1795312194787.mp4"></video>
  <div class="bg-scrim"></div>

  <header class="hero-header">
    <div class="logo-box">
      <img id="logo-img" class="logo-img" src="HALO.png" alt="Logo ZIKZ APP">
    </div>

    <div>
      <div class="hero-badge">
        <span class="hero-badge-dot"></span>
        HTML TO WEBSITE STUDIO
      </div>
    </div>
  </header>

  <main class="container">
    <div>
      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">
            <span class="accent-bar"></span>
            <span>INPUT &amp; KODE HTML</span>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="html-file">Unggah File (.html / .htm)</label>
          <div class="file-box">
            <input type="file" id="html-file" accept=".html,.htm" onchange="handleFileUpload(event)">
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="html-code">
            <span>KODE HTML / CSS / JS</span>
            <span style="font-size: 0.7rem; color: #ef4444; cursor: pointer;" onclick="clearCode()">[ HAPUS ]</span>
          </label>
          <textarea id="html-code" placeholder="<!DOCTYPE html>&#10;<html>&#10;<body>&#10;  <h1>ZIKZ APP READY</h1>&#10;</body>&#10;</html>"></textarea>
        </div>

        <div class="field">
          <label class="field-label" for="project-name">Nama Proyek</label>
          <input type="text" id="project-name" placeholder="Contoh: zikzproyek">
        </div>

        <div class="actions">
          <button class="btn btn-fire" type="button" onclick="previewHTML()">Preview Website</button>
          <button class="btn btn-dark" type="button" onclick="downloadHTML()">Download HTML</button>
        </div>

        <div class="publish-box">
          <div class="output-tag">Publish Ke GitHub Pages</div>
          <button class="btn btn-fire" id="btn-publish-gh" type="button" onclick="publishToGitHub()">
            Publish Otomatis Ke Link Publik
          </button>
          <div id="publish-status" class="publish-status"></div>
          <div id="published-link-actions" class="output-actions hidden">
            <button class="btn btn-dark btn-sm" type="button" onclick="copyPublishedUrl()">Salin Link</button>
            <button class="btn btn-ember btn-sm" type="button" onclick="openPublishedFresh()">Buka Tanpa Cache</button>
          </div>
        </div>
      </section>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="accent-bar"></span>
          <span>Live Preview</span>
        </div>
        <div class="preview-controls">
          <button class="btn btn-dark btn-sm" type="button" onclick="setPreviewMode('full')">Full</button>
          <button class="btn btn-dark btn-sm" type="button" onclick="setPreviewMode('mobile')">HP</button>
          <button class="btn btn-dark btn-sm" type="button" onclick="resetPreview()">Tutup</button>
        </div>
      </div>

      <div id="preview-empty" class="preview-empty">
        <strong>Belum Ada Pratinjau</strong>
      </div>

      <div class="preview-wrapper">
        <iframe id="preview-iframe" class="preview-frame hidden" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      </div>
    </section>
  </main>

  <div id="zikz-maintenance-overlay" style="display:none;position:fixed;inset:0;z-index:99999;background:#050507;color:#f9fafb;align-items:center;justify-content:center;padding:1.5rem;text-align:center;">
    <div style="max-width:480px;width:100%;background:#0d0d12;border:1px solid rgba(255,81,0,0.65);border-radius:18px;padding:2rem;box-shadow:0 20px 50px rgba(0,0,0,0.85);">
      <div style="display:inline-block;font-size:0.75rem;font-weight:800;letter-spacing:0.15em;text-transform:uppercase;color:#ff9e75;border:1px solid rgba(255,81,0,0.5);padding:0.35rem 0.9rem;border-radius:999px;margin-bottom:1rem;">
        SYSTEM MAINTENANCE
      </div>
      <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:0.75rem;color:#fff;">
        ZIKZ APP Sedang Diperbaiki
      </h1>
      <p id="zikz-maintenance-msg" style="font-size:0.9rem;line-height:1.6;color:#cbd5e1;">
        Sedang dalam perbaikan dan pemeliharaan sistem ZIKZ APP.
      </p>
    </div>
  </div>

  <script>
    let lastPublishedUrl = '';

    function getRepoTarget() {
      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(p => p.length > 0);
      let owner = 'stokemailzikzstr-coder';
      let repo = 'my-web';

      if (host.includes('github.io')) {
        owner = host.split('.')[0] || owner;
        repo = pathParts.length > 0 && !pathParts[0].endsWith('.html') ? pathParts[0] : `${owner}.github.io`;
      }

      const pagesBase = repo === `${owner}.github.io`
        ? `https://${owner}.github.io`
        : `https://${owner}.github.io/${repo}`;

      return { owner, repo, fullSlug: `${owner}/${repo}`, pagesBase };
    }

    function getAdminTokenFromStorage() {
      try {
        return (
          localStorage.getItem('zikzapp_admin_token_v1') ||
          localStorage.getItem('zikzapp_admin_token') ||
          localStorage.getItem('zikzapp_gh_token') ||
          ''
        ).trim();
      } catch (err) {
        return '';
      }
    }

    async function checkZikzMaintenance() {
      const overlay = document.getElementById('zikz-maintenance-overlay');
      const msgEl = document.getElementById('zikz-maintenance-msg');
      const { fullSlug } = getRepoTarget();

      try {
        const url = `https://raw.githubusercontent.com/${fullSlug}/HEAD/maintenance.json?t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return;

        const data = await res.json();
        if (data && data.maintenance === true) {
          if (data.message && msgEl) msgEl.textContent = data.message;
          if (overlay) overlay.style.display = 'flex';
        }
      } catch (err) {}
    }

    function setPreviewMode(mode) {
      const iframe = document.getElementById('preview-iframe');
      if (mode === 'mobile') iframe.classList.add('mobile-mode');
      else iframe.classList.remove('mobile-mode');
    }

    function resetPreview() {
      const iframe = document.getElementById('preview-iframe');
      const emptyBox = document.getElementById('preview-empty');
      iframe.srcdoc = '';
      iframe.classList.add('hidden');
      emptyBox.classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const vid = document.getElementById('bg-video');
      if (vid) {
        vid.muted = true;
        vid.play().catch(() => {});
      }
      checkZikzMaintenance();
    });

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        document.getElementById('html-code').value = e.target.result;
        if (!document.getElementById('project-name').value.trim()) {
          document.getElementById('project-name').value = file.name.replace(/\.html?$/i, '');
        }
        previewHTML();
      };
      reader.readAsText(file);
    }

    function previewHTML() {
      const code = document.getElementById('html-code').value;
      const iframe = document.getElementById('preview-iframe');
      const emptyBox = document.getElementById('preview-empty');
      if (!code.trim()) return;
      emptyBox.classList.add('hidden');
      iframe.classList.remove('hidden');
      iframe.srcdoc = code;
    }

    function buildSlug(rawValue) {
      const clean = (rawValue || '')
        .trim()
        .toLowerCase()
        .replace(/\.html?$/i, '')
        .replace(/[^a-z0-9-]/g, '');
      return clean || ('proyek-' + Math.floor(1000 + Math.random() * 9000));
    }

    function toBase64Utf8(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    async function publishToGitHub() {
      const code = document.getElementById('html-code').value;
      const statusEl = document.getElementById('publish-status');
      const btnPublish = document.getElementById('btn-publish-gh');
      const linkActions = document.getElementById('published-link-actions');
      const rawName = document.getElementById('project-name').value.trim();

      if (!code.trim()) {
        statusEl.textContent = 'Kode kosong.';
        return;
      }

      const token = getAdminTokenFromStorage();
      if (!token) {
        statusEl.innerHTML = 'Token admin belum tersimpan di browser ini. Buka <a href="dasborzikzapp.html">dasborzikzapp.html</a> untuk menyimpan token admin.';
        return;
      }

      btnPublish.disabled = true;
      linkActions.classList.add('hidden');
      statusEl.textContent = 'Menyiapkan publish...';

      try {
        const slug = buildSlug(rawName);
        const fileName = `${slug}.html`;
        const { fullSlug, pagesBase } = getRepoTarget();
        const apiUrl = `https://api.github.com/repos/${fullSlug}/contents/${fileName}`;

        let sha = null;
        const checkRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
          headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
          cache: 'no-store'
        });

        if (checkRes.ok) {
          const existingData = await checkRes.json();
          sha = existingData.sha;
          if (!confirm(`Timpa "${fileName}" di ${fullSlug}?`)) {
            statusEl.textContent = 'Dibatalkan.';
            btnPublish.disabled = false;
            return;
          }
        }

        const payload = { message: `Publish ${fileName} via ZIKZ APP`, content: toBase64Utf8(code) };
        if (sha) payload.sha = sha;

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await putRes.json();
        if (!putRes.ok) throw new Error(result.message || `HTTP ${putRes.status}`);

        lastPublishedUrl = `${pagesBase}/${fileName}`;
        linkActions.classList.remove('hidden');
        statusEl.innerHTML = `Berhasil: <a href="${lastPublishedUrl}" target="_blank" rel="noopener noreferrer">${lastPublishedUrl}</a>`;
      } catch (err) {
        statusEl.textContent = `Gagal: ${err.message}`;
      } finally {
        btnPublish.disabled = false;
      }
    }

    function openPublishedFresh() {
      if (!lastPublishedUrl) return;
      const sep = lastPublishedUrl.includes('?') ? '&' : '?';
      window.open(`${lastPublishedUrl}${sep}v=${Date.now()}`, '_blank', 'noopener,noreferrer');
    }

    function copyPublishedUrl() {
      if (!lastPublishedUrl) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastPublishedUrl).catch(() => {});
      }
    }

    function downloadHTML() {
      const code = document.getElementById('html-code').value;
      if (!code.trim()) return;
      const slug = buildSlug(document.getElementById('project-name').value);
      const blob = new Blob([code], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${slug}.html`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearCode() {
      document.getElementById('html-code').value = '';
      document.getElementById('html-file').value = '';
      document.getElementById('project-name').value = '';
      resetPreview();
      document.getElementById('published-link-actions').classList.add('hidden');
      document.getElementById('publish-status').textContent = '';
    }
  </script>
</body>
</html>
