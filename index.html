<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIKZ APP // HTML TO WEB</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #050507;
      --surface: rgba(12, 12, 18, 0.84);
      --surface-elevated: rgba(8, 8, 13, 0.94);
      --border: rgba(255, 255, 255, 0.13);
      --border-fire: rgba(255, 92, 24, 0.55);
      --text: #f9fafb;
      --muted: #cbd5e1;
      --fire-1: #ff5900;
      --fire-2: #ff1e42;
      --gold: #ffbe55;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: transparent !important;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .bg-base {
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 89, 0, 0.22), transparent 55%),
        radial-gradient(circle at 85% 75%, rgba(255, 30, 66, 0.14), transparent 50%),
        #050507;
      z-index: -5;
    }

    #bg-video {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: -2; opacity: 1; pointer-events: none;
    }

    .bg-scrim {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(180deg, rgba(5, 5, 7, 0.35) 0%, rgba(5, 5, 7, 0.58) 100%);
    }

    .hero-header {
      padding: 2.2rem 1rem 0.95rem; text-align: center; position: relative;
      z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 0.95rem;
    }

    .logo-ring {
      position: relative;
      padding: 3px;
      border-radius: 30px;
      background: linear-gradient(135deg, #ffd166, #ff5900, #ff1e42, #ff8c00);
      box-shadow: 0 0 36px rgba(255, 89, 0, 0.45);
      animation: logoSpin 16s linear infinite;
      will-change: transform;
    }

    @keyframes logoSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .logo-box {
      width: 144px; height: 144px; border-radius: 27px; background: #050507;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      user-select: none; pointer-events: none;
    }

    .logo-img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .welcome-wrap {
      position: relative;
      max-width: 640px;
      padding: 0.78rem 1.25rem;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(22, 16, 24, 0.88), rgba(8, 8, 12, 0.92));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 140, 50, 0.42);
      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .welcome-title {
      font-size: clamp(1.12rem, 4.5vw, 1.65rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.32;
      background: linear-gradient(110deg, #ffffff 0%, #ffe082 26%, #ff6a00 52%, #ff1e42 78%, #ffd166 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(255, 89, 0, 0.45));
      animation: textShine 4.5s linear infinite;
    }

    @keyframes textShine {
      0% { background-position: 0% center; }
      100% { background-position: 220% center; }
    }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.72rem;
      font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #ffb38a;
      background: rgba(10, 10, 15, 0.9); border: 1px solid rgba(255, 89, 0, 0.5);
      padding: 0.42rem 1.1rem; border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 16px rgba(255, 89, 0, 0.22);
    }

    .hero-badge-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #ff5900;
      box-shadow: 0 0 10px #ff5900; animation: pulseDot 1.8s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.75; }
    }

    /* LAYAR PILIH SERVER (AWAL MASUK) */
    .server-select-screen {
      max-width: 460px;
      margin: 1.35rem auto 3rem;
      padding: 0 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.05rem;
    }

    .server-select-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(24, 16, 26, 0.92), rgba(7, 7, 12, 0.96));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 110, 40, 0.45);
      border-radius: var(--radius);
      padding: 1.45rem 1.2rem;
      text-align: center;
      cursor: pointer;
      box-shadow:
        0 16px 38px rgba(0, 0, 0, 0.68),
        0 0 24px rgba(255, 89, 0, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: transform 0.18s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .server-select-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 20%, rgba(255, 170, 90, 0.14) 50%, transparent 80%);
      transform: translateX(-100%);
      transition: transform 0.55s ease;
      pointer-events: none;
    }

    .server-select-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 165, 90, 0.85);
      box-shadow:
        0 20px 44px rgba(0, 0, 0, 0.78),
        0 0 32px rgba(255, 89, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .server-select-card:hover::before {
      transform: translateX(100%);
    }

    .server-select-card:active { transform: scale(0.97); }

    .server-select-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff 0%, #ffd29d 55%, #ff7b39 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* STUDIO BUILDER UTAMA */
    .container {
      max-width: 1120px; margin: 0 auto; padding: 1rem 1rem 2.5rem;
      display: grid; grid-template-columns: 1fr; gap: 1.15rem;
    }

    @media (min-width: 900px) {
      .container { grid-template-columns: 1.05fr 0.95fr; align-items: start; padding: 1.25rem 1.25rem 2.5rem; gap: 1.25rem; }
    }

    .panel {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem;
      box-shadow:
        0 20px 44px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      margin-bottom: 0;
    }

    @media (min-width: 600px) {
      .panel { padding: 1.3rem; }
    }

    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
      padding-bottom: 0.85rem; margin-bottom: 1.05rem; border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }

    .panel-title {
      font-size: 0.9rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
      display: flex; align-items: center; gap: 0.55rem;
    }

    .accent-bar {
      width: 4px; height: 17px; border-radius: 99px;
      background: linear-gradient(180deg, var(--gold), var(--fire-1), var(--fire-2));
      box-shadow: 0 0 10px rgba(255, 89, 0, 0.5);
    }

    .top-bar-server {
      display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
      background: linear-gradient(90deg, rgba(255, 89, 0, 0.14), rgba(10, 10, 16, 0.9));
      border: 1px solid rgba(255, 110, 40, 0.42);
      border-radius: 13px; padding: 0.72rem 0.9rem; margin-bottom: 1rem;
    }

    .top-bar-text { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #ffb58a; }

    .field { margin-bottom: 1rem; }

    .field-label {
      display: flex; align-items: center; justify-content: space-between; font-size: 0.76rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
      margin-bottom: 0.45rem; gap: 0.5rem; flex-wrap: wrap;
    }

    .file-box {
      background: var(--surface-elevated); border: 1px solid rgba(255, 92, 24, 0.45);
      border-radius: 12px; padding: 0.65rem 0.75rem;
    }

    input[type="file"] { width: 100%; font-size: 0.8rem; color: var(--muted); cursor: pointer; }

    input[type="file"]::file-selector-button {
      background: linear-gradient(135deg, var(--fire-1), var(--fire-2)); color: #fff; border: none;
      border-radius: 8px; padding: 0.45rem 0.8rem; margin-right: 0.65rem; font-size: 0.74rem;
      font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 50, 30, 0.3);
    }

    input[type="text"], textarea {
      width: 100%; background: var(--surface-elevated); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.82rem 0.95rem; font-size: 0.88rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea { min-height: 220px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; line-height: 1.55; resize: vertical; }

    input[type="text"]:focus, textarea:focus {
      outline: none; border-color: var(--fire-1); box-shadow: 0 0 0 3px rgba(255, 89, 0, 0.24);
    }

    .actions { display: grid; grid-template-columns: 1fr; gap: 0.65rem; margin-top: 0.25rem; }

    .btn {
      width: 100%; appearance: none; border: none; border-radius: 12px; padding: 0.86rem 1rem; font-size: 0.78rem;
      font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; text-align: center;
      transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.98); }

    .btn-fire {
      background: linear-gradient(135deg, var(--fire-1), var(--fire-2));
      color: #fff;
      box-shadow:
        0 10px 26px rgba(255, 42, 66, 0.36),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .btn-fire:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 12px 30px rgba(255, 65, 20, 0.5); }

    .btn-ember {
      background: rgba(255, 89, 0, 0.12); color: #ffb38a;
      border: 1px solid rgba(255, 110, 40, 0.55);
    }
    .btn-ember:hover:not(:disabled) { background: rgba(255, 89, 0, 0.2); }

    .btn-dark {
      background: rgba(14, 14, 21, 0.92); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-dark:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.26); }

    .btn-sm { width: auto; padding: 0.44rem 0.78rem; font-size: 0.7rem; border-radius: 9px; }

    .publish-box {
      margin-top: 1rem; padding: 1.05rem; border-radius: 14px;
      background: linear-gradient(180deg, rgba(16, 13, 20, 0.95), rgba(8, 8, 12, 0.98));
      border: 1px solid rgba(255, 92, 24, 0.48);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .output-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.85rem; }
    .output-actions .btn { padding: 0.74rem 0.75rem; font-size: 0.74rem; line-height: 1.25; }

    .publish-status { margin-top: 0.85rem; font-size: 0.8rem; line-height: 1.55; color: var(--muted); word-break: break-word; overflow-wrap: anywhere; }
    .publish-status a { color: #ffb38a; font-weight: 700; text-decoration: underline; }

    .preview-controls { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .preview-wrapper { width: 100%; display: flex; justify-content: center; }

    .preview-frame {
      width: 100%; height: 440px; border: 1px solid var(--border); border-radius: 14px;
      background: #050507; transition: max-width 0.2s ease;
    }

    .preview-frame.mobile-mode { max-width: 375px; }

    .preview-empty {
      height: 360px; border: 1px dashed rgba(255, 255, 255, 0.18); border-radius: 14px;
      background: rgba(8, 8, 13, 0.75);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 1.5rem; color: var(--muted); font-size: 0.86rem; gap: 0.4rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="bg-base"></div>
  <video id="bg-video" autoplay muted loop playsinline preload="auto" src="ssstik.io_1795312194787.mp4"></video>
  <div class="bg-scrim"></div>

  <header class="hero-header">
    <div class="logo-ring">
      <div class="logo-box">
        <img id="logo-img" class="logo-img" src="HALO.png" alt="Logo ZIKZ APP">
      </div>
    </div>

    <div class="welcome-wrap">
      <h1 class="welcome-title">SELAMAT DATANG DI ZIKZ APP HTML TO WEB</h1>
    </div>

    <div>
      <div class="hero-badge">
        <span class="hero-badge-dot"></span>
        <span>PILIH SERVER</span>
      </div>
    </div>
  </header>

  <!-- HALAMAN AWAL: PILIH SERVER SAJA -->
  <main id="screen-server-select" class="server-select-screen">
    <div class="server-select-card" onclick="enterServer(1)">
      <div class="server-select-title">SERVER 1</div>
    </div>

    <div class="server-select-card" onclick="enterServer(2)">
      <div class="server-select-title">SERVER 2</div>
    </div>
  </main>

  <!-- HALAMAN STUDIO (BARU MUNCUL SETELAH PILIH SERVER) -->
  <main id="screen-studio" class="container hidden">
    <div>
      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">
            <span class="accent-bar"></span>
            <span>INPUT &amp; KODE HTML</span>
          </div>
        </div>

        <div class="top-bar-server">
          <span class="top-bar-text" id="active-server-name">SERVER 1</span>
          <button type="button" class="btn btn-dark btn-sm" onclick="backToSelectServer()">Ganti Server</button>
        </div>

        <div class="field">
          <label class="field-label" for="html-file">Unggah File (.html / .htm)</label>
          <div class="file-box">
            <input type="file" id="html-file" accept=".html,.htm" onchange="handleFileUpload(event)">
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="html-code">
            <span>KODE HTML / CSS / JS</span>
            <span style="font-size: 0.7rem; color: #ef4444; cursor: pointer;" onclick="clearCode()">[ HAPUS ]</span>
          </label>
          <textarea id="html-code" placeholder="<!DOCTYPE html>&#10;<html>&#10;<body>&#10;  <h1>ZIKZ APP READY</h1>&#10;</body>&#10;</html>"></textarea>
        </div>

        <div class="field">
          <label class="field-label" for="project-name">Nama Proyek</label>
          <input type="text" id="project-name" placeholder="Contoh: zikzproyek">
        </div>

        <div class="actions">
          <button class="btn btn-fire" type="button" onclick="previewHTML()">Preview Website</button>
          <button class="btn btn-dark" type="button" onclick="downloadHTML()">Download HTML</button>
        </div>

        <div class="publish-box">
          <button class="btn btn-fire" id="btn-create-web" type="button" onclick="createWebsite()">
            BUAT WEB NYA
          </button>
          <div id="publish-status" class="publish-status">Server aktif: SERVER 1</div>
          <div id="published-link-actions" class="output-actions hidden">
            <button class="btn btn-dark" type="button" onclick="copyPublishedUrl()">Salin Link</button>
            <button class="btn btn-ember" type="button" onclick="openPublishedFresh()">Buka Tanpa Cache</button>
          </div>
        </div>
      </section>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="accent-bar"></span>
          <span>Live Preview</span>
        </div>
        <div class="preview-controls">
          <button class="btn btn-dark btn-sm" type="button" onclick="setPreviewMode('full')">Full</button>
          <button class="btn btn-dark btn-sm" type="button" onclick="setPreviewMode('mobile')">HP</button>
          <button class="btn btn-dark btn-sm" type="button" onclick="resetPreview()">Tutup</button>
        </div>
      </div>

      <div id="preview-empty" class="preview-empty">
        <strong>Belum Ada Pratinjau</strong>
      </div>

      <div class="preview-wrapper">
        <iframe id="preview-iframe" class="preview-frame hidden" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      </div>
    </section>
  </main>

  <div id="zikz-maintenance-overlay" style="display:none;position:fixed;inset:0;z-index:99999;background:#050507;color:#f9fafb;align-items:center;justify-content:center;padding:1.5rem;text-align:center;">
    <div style="max-width:480px;width:100%;background:#0d0d12;border:1px solid rgba(255,81,0,0.65);border-radius:18px;padding:2rem;box-shadow:0 20px 50px rgba(0,0,0,0.85);">
      <div style="display:inline-block;font-size:0.75rem;font-weight:800;letter-spacing:0.15em;text-transform:uppercase;color:#ff9e75;border:1px solid rgba(255,81,0,0.5);padding:0.35rem 0.9rem;border-radius:999px;margin-bottom:1rem;">
        SYSTEM MAINTENANCE
      </div>
      <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:0.75rem;color:#fff;">
        ZIKZ APP Sedang Diperbaiki
      </h1>
      <p id="zikz-maintenance-msg" style="font-size:0.9rem;line-height:1.6;color:#cbd5e1;">
        Sedang dalam perbaikan dan pemeliharaan sistem ZIKZ APP.
      </p>
    </div>
  </div>

  <script>
    let lastPublishedUrl = '';

    function enterServer(serverNum) {
      const selectScreen = document.getElementById('screen-server-select');
      const studioScreen = document.getElementById('screen-studio');
      const activeServerText = document.getElementById('active-server-name');
      const publishStatus = document.getElementById('publish-status');

      selectScreen.classList.add('hidden');
      studioScreen.classList.remove('hidden');

      activeServerText.textContent = 'SERVER 1';
      publishStatus.textContent = serverNum === 2
        ? 'Dialihkan ke SERVER 1'
        : 'Server aktif: SERVER 1';
    }

    function backToSelectServer() {
      document.getElementById('screen-studio').classList.add('hidden');
      document.getElementById('screen-server-select').classList.remove('hidden');
    }

    function getGitHubToken() {
      try {
        return (
          localStorage.getItem('zikzapp_admin_token_v1') ||
          localStorage.getItem('zikzapp_admin_token') ||
          localStorage.getItem('zikzapp_gh_token') ||
          ''
        ).trim();
      } catch (err) {
        return '';
      }
    }

    function getRepoTarget() {
      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(p => p.length > 0);
      let owner = 'stokemailzikzstr-coder';
      let repo = 'my-web';

      if (host.includes('github.io')) {
        owner = host.split('.')[0] || owner;
        repo = pathParts.length > 0 && !pathParts[0].endsWith('.html') ? pathParts[0] : `${owner}.github.io`;
      }

      const pagesBase = repo === `${owner}.github.io`
        ? `https://${owner}.github.io`
        : `https://${owner}.github.io/${repo}`;

      return { owner, repo, fullSlug: `${owner}/${repo}`, pagesBase };
    }

    async function checkZikzMaintenance() {
      const overlay = document.getElementById('zikz-maintenance-overlay');
      const msgEl = document.getElementById('zikz-maintenance-msg');
      const { fullSlug } = getRepoTarget();

      try {
        const url = `https://raw.githubusercontent.com/${fullSlug}/HEAD/maintenance.json?t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return;

        const data = await res.json();
        if (data && data.maintenance === true) {
          if (data.message && msgEl) msgEl.textContent = data.message;
          if (overlay) overlay.style.display = 'flex';
        }
      } catch (err) {}
    }

    function setPreviewMode(mode) {
      const iframe = document.getElementById('preview-iframe');
      if (mode === 'mobile') iframe.classList.add('mobile-mode');
      else iframe.classList.remove('mobile-mode');
    }

    function resetPreview() {
      const iframe = document.getElementById('preview-iframe');
      const emptyBox = document.getElementById('preview-empty');
      iframe.srcdoc = '';
      iframe.classList.add('hidden');
      emptyBox.classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const vid = document.getElementById('bg-video');
      if (vid) {
        vid.muted = true;
        vid.play().catch(() => {});
      }
      checkZikzMaintenance();
    });

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        document.getElementById('html-code').value = e.target.result;
        if (!document.getElementById('project-name').value.trim()) {
          document.getElementById('project-name').value = file.name.replace(/\.html?$/i, '');
        }
        previewHTML();
      };
      reader.readAsText(file);
    }

    function previewHTML() {
      const code = document.getElementById('html-code').value;
      const iframe = document.getElementById('preview-iframe');
      const emptyBox = document.getElementById('preview-empty');
      if (!code.trim()) return;
      emptyBox.classList.add('hidden');
      iframe.classList.remove('hidden');
      iframe.srcdoc = code;
    }

    function buildSlug(rawValue) {
      const clean = (rawValue || '')
        .trim()
        .toLowerCase()
        .replace(/\.html?$/i, '')
        .replace(/[^a-z0-9-]/g, '');
      return clean || ('proyek-' + Math.floor(1000 + Math.random() * 9000));
    }

    function toBase64Utf8(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    async function createWebsite() {
      const code = document.getElementById('html-code').value;
      const statusEl = document.getElementById('publish-status');
      const btn = document.getElementById('btn-create-web');
      const linkActions = document.getElementById('published-link-actions');
      const rawName = document.getElementById('project-name').value.trim();

      if (!code.trim()) {
        statusEl.textContent = 'Kode HTML masih kosong.';
        return;
      }

      const token = getGitHubToken();
      if (!token) {
        statusEl.innerHTML = 'Token belum tersimpan. Buka <a href="dasborzikzapp.html">dasborzikzapp.html</a> untuk menyimpan token.';
        return;
      }

      btn.disabled = true;
      linkActions.classList.add('hidden');
      statusEl.textContent = 'Membuat web di SERVER 1...';

      try {
        const slug = buildSlug(rawName);
        const fileName = `${slug}.html`;
        const { fullSlug, pagesBase } = getRepoTarget();
        const apiUrl = `https://api.github.com/repos/${fullSlug}/contents/${fileName}`;

        let sha = null;
        const checkRes = await fetch(`${apiUrl}?t=${Date.now()}`, {
          headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
          cache: 'no-store'
        });

        if (checkRes.ok) {
          const existingData = await checkRes.json();
          sha = existingData.sha;
          if (!confirm(`Timpa "${fileName}" di ${fullSlug}?`)) {
            statusEl.textContent = 'Dibatalkan.';
            btn.disabled = false;
            return;
          }
        }

        const payload = { message: `Publish ${fileName} via ZIKZ APP`, content: toBase64Utf8(code) };
        if (sha) payload.sha = sha;

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await putRes.json();
        if (!putRes.ok) throw new Error(result.message || `HTTP ${putRes.status}`);

        lastPublishedUrl = `${pagesBase}/${fileName}`;
        linkActions.classList.remove('hidden');
        statusEl.innerHTML = `Berhasil dibuat di <strong>SERVER 1</strong>: <a href="${lastPublishedUrl}" target="_blank" rel="noopener noreferrer">${lastPublishedUrl}</a>`;
      } catch (err) {
        statusEl.textContent = `Gagal: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    function openPublishedFresh() {
      if (!lastPublishedUrl) return;
      const sep = lastPublishedUrl.includes('?') ? '&' : '?';
      window.open(`${lastPublishedUrl}${sep}v=${Date.now()}`, '_blank', 'noopener,noreferrer');
    }

    function copyPublishedUrl() {
      if (!lastPublishedUrl) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastPublishedUrl).catch(() => {});
      }
    }

    function downloadHTML() {
      const code = document.getElementById('html-code').value;
      if (!code.trim()) return;
      const slug = buildSlug(document.getElementById('project-name').value);
      const blob = new Blob([code], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${slug}.html`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearCode() {
      document.getElementById('html-code').value = '';
      document.getElementById('html-file').value = '';
      document.getElementById('project-name').value = '';
      resetPreview();
      document.getElementById('published-link-actions').classList.add('hidden');
      document.getElementById('publish-status').textContent = 'Server aktif: SERVER 1';
    }
  </script>
</body>
</html>
