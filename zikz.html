<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIKZ APP // HTML TO WEB</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #050507;
      --surface: rgba(5, 5, 7, 0.88);
      --surface-elevated: #050507;
      --border: rgba(255, 255, 255, 0.14);
      --border-fire: rgba(255, 77, 0, 0.55);
      --text: #f9fafb;
      --muted: #cbd5e1;
      --fire-1: #ff5100;
      --fire-2: #ff1e42;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: transparent !important;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .bg-base {
      position: fixed;
      inset: 0;
      background: #050507;
      z-index: -5;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      opacity: 1;
      pointer-events: none;
    }

    .bg-scrim {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: transparent;
    }

    /* Kotak Logo Permanen di Tengah Atas dengan Putaran Halus */
    .hero-header {
      padding: 2.25rem 1rem 1rem;
      text-align: center;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }

    .logo-box {
      width: 156px;
      height: 156px;
      border-radius: 28px;
      background: #050507;
      border: 1px solid rgba(255, 136, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 28px rgba(255, 81, 0, 0.35);
      user-select: none;
      pointer-events: none;
      animation: logoSpin 14s linear infinite;
      will-change: transform;
    }

    @keyframes logoSpin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ff9e75;
      background: #050507;
      border: 1px solid rgba(255, 81, 0, 0.5);
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
    }

    .hero-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff5100;
      box-shadow: 0 0 10px #ff5100;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 2.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 900px) {
      .container {
        grid-template-columns: 1.05fr 0.95fr;
        align-items: start;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-bottom: 0.9rem;
      margin-bottom: 1.1rem;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .accent-bar {
      width: 4px;
      height: 16px;
      border-radius: 99px;
      background: linear-gradient(180deg, var(--fire-1), var(--fire-2));
    }

    .field {
      margin-bottom: 1rem;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    .file-box {
      background: var(--surface-elevated);
      border: 1px solid rgba(255, 81, 0, 0.45);
      border-radius: 12px;
      padding: 0.65rem 0.75rem;
    }

    input[type="file"] {
      width: 100%;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      background: linear-gradient(135deg, var(--fire-1), var(--fire-2));
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      margin-right: 0.7rem;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    input[type="text"],
    textarea {
      width: 100%;
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 0.95rem;
      font-size: 0.9rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea {
      min-height: 230px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.55;
      resize: vertical;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--fire-1);
      box-shadow: 0 0 0 3px rgba(255, 81, 0, 0.25);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-top: 0.5rem;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 0.82rem 1rem;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: transform 0.14s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-fire {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, var(--fire-1), var(--fire-2));
      color: #fff;
      box-shadow: 0 10px 24px rgba(255, 42, 66, 0.35);
    }

    .btn-fire:hover {
      filter: brightness(1.08);
      box-shadow: 0 12px 28px rgba(255, 65, 20, 0.5);
    }

    .btn-ember {
      background: #050507;
      color: #ff9c73;
      border: 1px solid var(--border-fire);
    }

    .btn-ember:hover {
      background: #0d0d12;
    }

    .btn-dark {
      background: #050507;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-dark:hover {
      background: #0d0d12;
    }

    .output-box {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 12px;
      background: #050507;
      border: 1px solid rgba(255, 81, 0, 0.5);
    }

    .output-tag {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #ff9c73;
      margin-bottom: 0.5rem;
    }

    .output-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.65rem;
      flex-wrap: wrap;
    }

    .output-actions .btn {
      flex: 1 1 130px;
      padding: 0.65rem 0.85rem;
    }

    .hint {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 0.65rem;
      line-height: 1.45;
    }

    .preview-frame {
      width: 100%;
      height: 440px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #050507;
    }

    .preview-empty {
      height: 440px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #050507;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.86rem;
      gap: 0.4rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="bg-base"></div>
  <video id="bg-video" autoplay muted loop playsinline preload="auto" src="Ssstik.io_1795312194787.mp4"></video>
  <div class="bg-scrim"></div>

  <!-- Kotak Logo Permanen Berputar Halus -->
  <header class="hero-header">
    <div class="logo-box">
      <img id="logo-img" class="logo-img" src="HALO.png" alt="Logo ZIKZ APP">
    </div>

    <div>
      <div class="hero-badge">
        <span class="hero-badge-dot"></span>
        HTML TO WEBSITE STUDIO
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="accent-bar"></span>
          <span>Input &amp; Kode HTML</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="html-file">Unggah File (.html / .htm)</label>
        <div class="file-box">
          <input type="file" id="html-file" accept=".html,.htm" onchange="handleFileUpload(event)">
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="html-code">
          <span>Kode HTML / CSS / JS</span>
          <span style="font-size: 0.7rem; color: #ef4444; cursor: pointer;" onclick="clearCode()">[ HAPUS ]</span>
        </label>
        <textarea id="html-code" placeholder="<!DOCTYPE html>&#10;<html>&#10;<body>&#10;  <h1>ZIKZ APP READY</h1>&#10;</body>&#10;</html>"></textarea>
      </div>

      <div class="field">
        <label class="field-label" for="project-name">Nama Proyek</label>
        <input type="text" id="project-name" placeholder="Contoh: zikzapp.id">
      </div>

      <div class="actions">
        <button class="btn btn-fire" type="button" onclick="previewHTML()">Preview Website</button>
        <button class="btn btn-ember" type="button" onclick="preparePage()">UBAH KE WEB</button>
        <button class="btn btn-dark" type="button" onclick="downloadHTML()">Download HTML</button>
      </div>

      <div id="output-box" class="output-box hidden">
        <div class="output-tag">Halaman Lokal Siap</div>
        <input type="text" id="local-label" readonly>
        <div class="output-actions">
          <button class="btn btn-dark" type="button" onclick="copyLabel()">Salin Label</button>
          <button class="btn btn-fire" type="button" onclick="openBlobPage()">Buka Website</button>
        </div>
        <p class="hint">Dibuka lewat Blob URL lokal di browser ini. Gunakan <strong>Download HTML</strong> jika ingin mengunggah file ke hosting publik.</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="accent-bar"></span>
          <span>Live Preview</span>
        </div>
        <button class="btn btn-dark" type="button" style="padding: 0.4rem 0.75rem; font-size: 0.72rem;" onclick="openBlobPage()">Tab Baru</button>
      </div>

      <div id="preview-empty" class="preview-empty">
        <strong>Belum Ada Pratinjau</strong>
        <span>Klik <em>Preview Website</em> atau unggah file HTML untuk melihat hasil.</span>
      </div>

      <iframe id="preview-iframe" class="preview-frame hidden" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </section>
  </main>

  <script>
    let activeBlobUrl = null;

    window.addEventListener('DOMContentLoaded', () => {
      const vid = document.getElementById('bg-video');
      if (vid) {
        vid.muted = true;
        vid.play().catch(() => {});
      }
    });

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        document.getElementById('html-code').value = e.target.result;
        previewHTML();
      };
      reader.readAsText(file);
    }

    function previewHTML() {
      const code = document.getElementById('html-code').value;
      const iframe = document.getElementById('preview-iframe');
      const emptyBox = document.getElementById('preview-empty');

      if (!code.trim()) {
        alert('Masukkan atau unggah kode HTML terlebih dahulu.');
        return;
      }

      emptyBox.classList.add('hidden');
      iframe.classList.remove('hidden');
      iframe.srcdoc = code;
    }

    function preparePage() {
      const code = document.getElementById('html-code').value;
      let slug = document.getElementById('project-name').value.trim();

      if (!code.trim()) {
        alert('Kode HTML masih kosong.');
        return;
      }

      if (!slug) {
        slug = 'proyek-' + Math.floor(1000 + Math.random() * 9000);
      }

      slug = slug.toLowerCase().replace(/[^a-z0-9-]/g, '') || 'zikz-web';
      const label = `local://${slug}.html`;

      document.getElementById('local-label').value = label;
      document.getElementById('output-box').classList.remove('hidden');

      try {
        localStorage.setItem('zikzapp_page_' + slug, code);
      } catch (err) {}

      previewHTML();
    }

    function copyLabel() {
      const input = document.getElementById('local-label');
      if (!input.value) return;
      input.select();
      input.setSelectionRange(0, 99999);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(input.value).catch(() => document.execCommand('copy'));
      } else {
        document.execCommand('copy');
      }
      alert('Label berhasil disalin.');
    }

    function openBlobPage() {
      const code = document.getElementById('html-code').value;
      if (!code.trim()) {
        alert('Kode HTML masih kosong.');
        return;
      }

      if (activeBlobUrl) {
        URL.revokeObjectURL(activeBlobUrl);
      }

      const blob = new Blob([code], { type: 'text/html' });
      activeBlobUrl = URL.createObjectURL(blob);
      window.open(activeBlobUrl, '_blank');
    }

    function downloadHTML() {
      const code = document.getElementById('html-code').value;
      if (!code.trim()) {
        alert('Kode HTML masih kosong.');
        return;
      }

      let slug = document.getElementById('project-name').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
      const filename = (slug || 'index') + '.html';

      const blob = new Blob([code], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearCode() {
      document.getElementById('html-code').value = '';
      document.getElementById('html-file').value = '';
      document.getElementById('project-name').value = '';

      const iframe = document.getElementById('preview-iframe');
      const emptyBox = document.getElementById('preview-empty');
      iframe.srcdoc = '';
      iframe.classList.add('hidden');
      emptyBox.classList.remove('hidden');

      document.getElementById('output-box').classList.add('hidden');
    }
  </script>
</body>
</html>
