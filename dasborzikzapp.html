<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIKZ APP // MONITORING DASHBOARD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg: #050507;
      --surface: rgba(14, 14, 20, 0.92);
      --surface-elevated: #0b0b10;
      --border: rgba(255, 255, 255, 0.12);
      --border-fire: rgba(255, 81, 0, 0.6);
      --text: #f8fafc;
      --muted: #94a3b8;
      --fire-1: #ff5100;
      --fire-2: #ff1e42;
      --glow: rgba(255, 62, 13, 0.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 81, 0, 0.22), transparent 55%),
        radial-gradient(circle at 85% 20%, rgba(255, 30, 66, 0.14), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      padding: 1.5rem 1rem 3rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ffab88;
      background: rgba(255, 81, 0, 0.1);
      border: 1px solid rgba(255, 81, 0, 0.55);
      padding: 0.42rem 1.15rem;
      border-radius: 999px;
      box-shadow: 0 0 22px rgba(255, 81, 0, 0.22);
      margin-bottom: 0.85rem;
    }

    .title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(1.85rem, 5.5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 15%, #ff8c5a 55%, var(--fire-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 1rem;
      right: 1rem;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--fire-1), var(--fire-2), transparent);
      opacity: 0.85;
    }

    .stat-label {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: #ff9c73;
      font-family: 'JetBrains Mono', monospace;
    }

    .panel {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 1.25rem;
      right: 1.25rem;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--fire-1), var(--fire-2), transparent);
      opacity: 0.85;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .panel-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.98rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .accent-bar {
      width: 4px;
      height: 16px;
      border-radius: 99px;
      background: linear-gradient(180deg, var(--fire-1), var(--fire-2));
    }

    .field {
      margin-bottom: 0.95rem;
    }

    .field-label {
      display: block;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    select,
    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 0.92rem;
      font-size: 0.88rem;
      font-family: inherit;
    }

    select:focus,
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--fire-1);
      box-shadow: 0 0 0 3px rgba(255, 81, 0, 0.2);
    }

    .btn-fire {
      background: linear-gradient(135deg, var(--fire-1), var(--fire-2));
      color: #fff;
      border: none;
      padding: 0.76rem 1.15rem;
      border-radius: 10px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 18px var(--glow);
    }

    .btn-fire:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-refresh {
      background: #050507;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.95rem;
      border-radius: 99px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      background: #14141a;
      border-color: var(--fire-1);
    }

    .status-note {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .web-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .web-item {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      transition: border-color 0.2s;
    }

    .web-item:hover {
      border-color: var(--border-fire);
    }

    .web-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .web-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }

    .web-date {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .btn-open {
      background: linear-gradient(135deg, var(--fire-1), var(--fire-2));
      color: #fff;
      text-decoration: none;
      padding: 0.52rem 1rem;
      border-radius: 8px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(255, 42, 66, 0.3);
    }

    .btn-open:hover {
      filter: brightness(1.08);
    }

    .loading, .empty {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">ZIKZ APP ANALYTICS</div>
      <h1 class="title">Web Monitoring Dashboard</h1>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Web Dibuat</span>
        <span class="stat-value" id="stat-total-web">-</span>
      </div>

      <div class="stat-card">
        <span class="stat-label">Status ZIKZ APP</span>
        <span class="stat-value" id="stat-maintenance-label">-</span>
      </div>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="accent-bar"></span>
          <span>Menu Maintenance Web ZIKZ APP</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="maintenance-mode">Status Web ZIKZ APP</label>
        <select id="maintenance-mode">
          <option value="false">Normal / Aktif (Bisa Diakses)</option>
          <option value="true">Maintenance / Sedang Diperbaiki</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="maintenance-message">Pesan Saat Sedang Diperbaiki</label>
        <input type="text" id="maintenance-message" value="Sedang dalam perbaikan dan pemeliharaan sistem ZIKZ APP. Silakan cek kembali beberapa saat lagi.">
      </div>

      <div class="field">
        <label class="field-label" for="dash-gh-token">Fine-Grained GitHub Token (Tersimpan Lokal di HP)</label>
        <input type="password" id="dash-gh-token" placeholder="Tempel token GitHub untuk mengubah status maintenance...">
      </div>

      <button class="btn-fire" id="btn-save-maintenance" type="button" onclick="saveMaintenanceStatus()">
        Simpan Status Maintenance
      </button>
      <p class="status-note" id="maintenance-status-note">
        Mengatur status file <code>maintenance.json</code> di repository <code>stokemailzikzstr-coder/my-web</code>.
      </p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="accent-bar"></span>
          <span>Daftar Web Yang Dibuat Pengguna</span>
        </div>
        <button class="btn-refresh" type="button" onclick="refreshDashboard()">Refresh Data</button>
      </div>

      <div id="web-list-container" class="web-list">
        <div class="loading">Memuat data dari GitHub...</div>
      </div>
    </section>
  </div>

  <script>
    const GH_OWNER = 'stokemailzikzstr-coder';
    const GH_REPO = 'my-web';
    const MAINT_FILE = 'maintenance.json';

    function toBase64Utf8(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function fromBase64Utf8(str) {
      const binary = atob(str);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    async function loadMaintenanceStatus() {
      const modeSelect = document.getElementById('maintenance-mode');
      const msgInput = document.getElementById('maintenance-message');
      const statusBadge = document.getElementById('stat-maintenance-label');
      const token = (document.getElementById('dash-gh-token').value || '').trim();

      try {
        let isMaint = false;
        let message = '';

        // Prioritas pake GitHub API langsung kalo ada token biar realtime tanpa cache CDN
        if (token) {
          const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${MAINT_FILE}?t=${Date.now()}`;
          const res = await fetch(apiUrl, {
            headers: { Authorization: `Bearer ${token}` },
            cache: 'no-store'
          });
          if (res.ok) {
            const data = await res.json();
            const decodedContent = JSON.parse(fromBase64Utf8(data.content.replace(/\n/g, '')));
            isMaint = Boolean(decodedContent && decodedContent.maintenance === true);
            message = decodedContent.message || '';
          }
        } else {
          // Fallback kalo token belum diisi
          const url = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/HEAD/${MAINT_FILE}?t=${Date.now()}`;
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            isMaint = Boolean(data && data.maintenance === true);
            message = data.message || '';
          }
        }

        modeSelect.value = isMaint ? 'true' : 'false';
        if (message) msgInput.value = message;
        statusBadge.textContent = isMaint ? 'MAINTENANCE' : 'AKTIF';
      } catch (err) {
        statusBadge.textContent = 'AKTIF';
      }
    }

    async function saveMaintenanceStatus() {
      const modeSelect = document.getElementById('maintenance-mode');
      const msgInput = document.getElementById('maintenance-message');
      const tokenInput = document.getElementById('dash-gh-token');
      const btn = document.getElementById('btn-save-maintenance');
      const note = document.getElementById('maintenance-status-note');
      const statusBadge = document.getElementById('stat-maintenance-label');

      const token = (tokenInput.value || '').trim();
      if (!token) {
        note.textContent = 'Masukkan Fine-grained GitHub token terlebih dahulu untuk menyimpan perubahan.';
        return;
      }

      try {
        localStorage.setItem('zikzapp_gh_token', token);
      } catch (err) {}

      const isMaint = modeSelect.value === 'true';
      const message = (msgInput.value || '').trim() || 'Sedang dalam perbaikan sistem. Silakan coba lagi nanti.';
      const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${MAINT_FILE}`;

      btn.disabled = true;
      note.textContent = 'Menyimpan status maintenance ke GitHub...';

      try {
        let sha = null;
        const checkRes = await fetch(apiUrl, {
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json`
          }
        });
        if (checkRes.ok) {
          const existing = await checkRes.json();
          sha = existing.sha;
        }

        const contentObj = {
          maintenance: isMaint,
          message: message,
          updatedAt: new Date().toISOString()
        };

        const payload = {
          message: `${isMaint ? 'Enable' : 'Disable'} maintenance mode via ZIKZ Dashboard`,
          content: toBase64Utf8(JSON.stringify(contentObj, null, 2))
        };
        if (sha) payload.sha = sha;

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await putRes.json();
        if (!putRes.ok) {
          throw new Error(result.message || `Gagal menyimpan (HTTP ${putRes.status})`);
        }

        statusBadge.textContent = isMaint ? 'MAINTENANCE' : 'AKTIF';
        note.textContent = isMaint
          ? 'Status BERHASIL diubah ke MAINTENANCE! Web ZIKZ APP sekarang menampilkan layar perbaikan.'
          : 'Status BERHASIL diubah ke NORMAL / AKTIF! Web ZIKZ APP terbuka normal kembali.';
      } catch (err) {
        note.textContent = `Gagal menyimpan status: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    async function fetchWebList() {
      const container = document.getElementById('web-list-container');
      const statTotal = document.getElementById('stat-total-web');
      container.innerHTML = '<div class="loading">Memuat data dari GitHub...</div>';

      try {
        const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/`);
        if (!res.ok) throw new Error('Gagal mengambil data dari GitHub');

        const files = await res.json();

        const htmlFiles = files.filter(file =>
          file.name.endsWith('.html') &&
          file.name !== 'index.html' &&
          file.name !== 'dasborzikzapp.html'
        );

        statTotal.textContent = htmlFiles.length;

        if (htmlFiles.length === 0) {
          container.innerHTML = '<div class="empty">Belum ada web baru yang dibuat oleh pengguna.</div>';
          return;
        }

        container.innerHTML = '';
        htmlFiles.forEach(file => {
          const liveUrl = `https://${GH_OWNER}.github.io/${GH_REPO}/${file.name}`;

          const item = document.createElement('div');
          item.className = 'web-item';
          item.innerHTML = `
            <div class="web-info">
              <span class="web-name">${file.name}</span>
              <span class="web-date">Ukuran File: ${(file.size / 1024).toFixed(1)} KB</span>
            </div>
            <a href="${liveUrl}" target="_blank" rel="noopener noreferrer" class="btn-open">Buka Web</a>
          `;
          container.appendChild(item);
        });

      } catch (err) {
        container.innerHTML = `<div class="empty" style="color:#ef4444;">Error: ${err.message}</div>`;
        statTotal.textContent = '0';
      }
    }

    function refreshDashboard() {
      fetchWebList();
      loadMaintenanceStatus();
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const savedToken = localStorage.getItem('zikzapp_gh_token');
        const tokenInput = document.getElementById('dash-gh-token');
        if (savedToken && tokenInput) {
          tokenInput.value = savedToken;
        }
      } catch (err) {}

      refreshDashboard();
    });
  </script>
</body>
</html>
